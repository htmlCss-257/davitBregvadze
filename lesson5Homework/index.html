<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Essentials Shop</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--primary-hover);
    }

    .badge {
      background: white;
      color: var(--primary);
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Hero / Intro */
    .hero {
      text-align: center;
      padding: 3rem 1rem 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--text-muted);
    }

    /* Product Grid */
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .add-btn {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Cart Slide-out Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 50;
    }

    .drawer-overlay.open {
      visibility: visible;
      opacity: 1;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: var(--card-bg);
      z-index: 60;
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease-out;
    }

    .cart-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      list-style: none;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-details {
      max-width: 160px;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cart-item-price {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .drawer-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .checkout-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .checkout-btn:hover {
      background: #15803d;
    }

    .empty-cart-msg {
      text-align: center;
      color: var(--text-muted);
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">🌿 DailyGoods</a>
      <button class="cart-btn" onclick="toggleCart()">
        Cart <span class="badge" id="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Intro -->
  <div class="hero">
    <h1>Simple Everyday Essentials</h1>
    <p>Hand-picked, minimalist products for your everyday workspace and home.</p>
  </div>

  <!-- Product Catalog -->
  <main>
    <div class="products-grid" id="product-grid"></div>
  </main>

  <!-- Sliding Cart Panel -->
  <div class="drawer-overlay" id="overlay" onclick="toggleCart()"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="drawer-header">
      <h2>Your Basket</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>

    <ul class="cart-items" id="cart-items">
      <!-- Items will render here -->
    </ul>

    <div class="drawer-footer">
      <div class="total-row">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </aside>

  <script>
    // 1. Data: Simple everyday items
    const products = [
      {
        id: 1,
        name: "Ceramic Coffee Mug",
        price: 14.0,
        desc: "Matte-finish ceramic mug, 350ml capacity.",
        image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 2,
        name: "Linen Notebook",
        price: 9.5,
        desc: "Hardcover notebook with 160 dotted pages.",
        image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 3,
        name: "Soy Wax Candle",
        price: 16.0,
        desc: "Clean-burning cedarwood & lavender aroma.",
        image: "https://images.unsplash.com/photo-1603006905003-be475563bc59?w=400&auto=format&fit=crop&q=60"
      },
      {
        id: 4,
        name: "Minimalist Pen",
        price: 4.5,
        desc: "Smooth gel rollerball with durable metal clip.",
        image: "https://images.unsplash.com/photo-1585336261026-41829e19277d?w=400&auto=format&fit=crop&q=60"
      }
    ];

    let cart = {};

    // 2. Render Products
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.name}" class="card-img" loading="lazy" />
          <div class="card-body">
            <h3 class="card-title">${p.name}</h3>
            <p class="card-desc">${p.desc}</p>
            <div class="card-footer">
              <span class="price">$${p.price.toFixed(2)}</span>
              <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    // 3. Cart State Management
    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCart();
    }

    function updateQuantity(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) {
        delete cart[id];
      }
      updateCart();
    }

    function updateCart() {
      const list = document.getElementById("cart-items");
      const badge = document.getElementById("cart-badge");
      const totalEl = document.getElementById("cart-total");

      const itemIds = Object.keys(cart);
      let count = 0;
      let total = 0;

      if (itemIds.length === 0) {
        list.innerHTML = `<li class="empty-cart-msg">Your cart is empty.</li>`;
      } else {
        list.innerHTML = itemIds.map(id => {
          const product = products.find(p => p.id === parseInt(id));
          const qty = cart[id];
          count += qty;
          total += product.price * qty;

          return `
            <li class="cart-item">
              <div class="cart-item-details">
                <div class="cart-item-title">${product.name}</div>
                <div class="cart-item-price">$${product.price.toFixed(2)} each</div>
              </div>
              <div class="cart-controls">
                <button class="qty-btn" onclick="updateQuantity(${product.id}, -1)">-</button>
                <span>${qty}</span>
                <button class="qty-btn" onclick="updateQuantity(${product.id}, 1)">+</button>
              </div>
            </li>
          `;
        }).join("");
      }

      badge.textContent = count;
      totalEl.textContent = `$${total.toFixed(2)}`;
    }

    // 4. UI Actions
    function toggleCart() {
      document.getElementById("cart-drawer").classList.toggle("open");
      document.getElementById("overlay").classList.toggle("open");
    }

    function checkout() {
      const totalItems = Object.values(cart).reduce((sum, q) => sum + q, 0);
      if (totalItems === 0) {
        alert("Your cart is empty!");
        return;
      }
      alert("Thank you for your order!");
      cart = {};
      updateCart();
      toggleCart();
    }

    // Init
    renderProducts();
    updateCart();
  </script>
</body>
</html>
